<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- NFCToolsGUI 程序图标（三门禁风）：
       深蓝渐变圆角底 + 白色 NFC 卡 + 三条向上信号弧。
       源文件保持人可读，PNG/ICO 由 tools/gen_icon.sh 生成。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FA3E0"/>
      <stop offset="1" stop-color="#07488A"/>
    </linearGradient>
  </defs>

  <!-- 底板 -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>

  <!-- 信号弧：从卡顶向上发散的三道 NFC 波 -->
  <g fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round">
    <path d="M 104 160 A 24 24 0 0 1 152 160"/>
    <path d="M 86 160 A 42 42 0 0 1 170 160"/>
    <path d="M 68 160 A 60 60 0 0 1 188 160"/>
  </g>

  <!-- NFC 卡 -->
  <rect x="55" y="160" width="146" height="60" rx="14" fill="#FFFFFF"/>
  <!-- 芯片 -->
  <rect x="76" y="178" width="28" height="24" rx="5" fill="#2E7BB8"/>
  <!-- 卡内导流线（呼应卡内数据走向） -->
  <path d="M 128 168 v 44" stroke="#C9E0F3" stroke-width="6" stroke-linecap="round"/>
  <path d="M 128 190 h 48" stroke="#C9E0F3" stroke-width="6" stroke-linecap="round"/>
</svg>
