[workspace]
members = ["crates/nfc-core", "crates/nfc-app"]
resolver = "2"

# 发布构建。`opt-level = "z"` 最激进体积优化（GUI 场景性能瓶颈在 I/O/GPU，
# CPU 优化级别对体验无感知影响）；`lto = true` 全 LTO 提升死代码消除与内联；
# `strip = "debuginfo"` 连调试段一并剥离。实测 release 产物约 10-13MB
# （Linux x86_64，未含 framework/bin）。原版 Electron 打包后约 100MB+，此处不设上限。
# `[profile.release.package."*"]` 把同一组配置下推到全部依赖链，避免某个依赖
# 用默认 debug 级编译把体积撑大。
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "debuginfo"
panic = "abort"

[profile.release.package."*"]
opt-level = "z"
panic = "abort"
