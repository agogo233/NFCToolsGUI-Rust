# CI：全量测试 + 静态门禁 + Windows 发布构建。
#
# 项目已脱离原版 Electron 源码：verify_parity.py 不再对拍上游，CI 不 checkout 原版。
# framework/bin 的 C 工具由 compile.sh 构建：Linux test job 编译后跑真二进制集成
# 测试（real_tools/tool_cli），Windows build job 编译后随 exe 打包。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── 1) Linux：编译 + 测试 + 静态门禁 ───────────────────────────────────
  test:
    name: test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # eframe/winit 在 Linux 上需要这几个系统库。**不需要 libgtk-3**：
      # rfd 用的是默认特性 xdg-portal + wayland，gtk3 是可选且非默认特性。
      # C 工具编译（compile.sh）需要 autoconf/libtool/patchelf 等。
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libwayland-dev libudev-dev libxcb1-dev \
            autoconf automake libtool cmake patchelf unzip \
            libusb-1.0-0-dev libreadline-dev zlib1g-dev liblzma-dev \
            pkg-config

      - name: 外联审计（不得引入网络栈）
        run: |
          # 本项目是纯本地工具，任何 HTTP/DNS 依赖都是可疑的。
          if grep -rnE '\b(reqwest|hyper|tokio::net|tokio::dns|ureq|isahc|surf|curl)\b' \
               --include='*.rs' --include='*.toml' crates/ ; then
            echo "::error::发现网络相关依赖或调用，纯本地工具不应有"
            exit 1
          fi
          echo "外联审计通过"

      - name: 格式检查
        run: cargo fmt --all --check

      - name: Clippy（零告警）
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `real-serial` 是 default-features 之外的唯一特性，其 `RealSerial` 实现
      # 平时不参与编译——不单独验一次，就等于从未被编译器看过。
      - name: Clippy（real-serial 特性）
        run: cargo clippy --workspace --all-targets --features real-serial -- -D warnings

      # 编译 framework/bin 的 C 工具：real_tools/tool_cli 是真二进制集成测试，
      # 缺它们会自动跳过（CI 盲区）。compile.sh 已在本地验证可跑通。
      - name: 编译 C 工具（compile.sh）
        run: bash compile.sh

      - name: 单元 + 集成测试
        run: cargo test --workspace --locked

      # real_tools / tool_cli 针对真实 C 二进制，需 NFC_FRAMEWORK_BIN 指向产物。
      - name: 真二进制集成测试（real_tools + tool_cli）
        env:
          NFC_FRAMEWORK_BIN: ./framework/bin
        run: cargo test -p nfc-core --test real_tools --test tool_cli --locked

      - name: core selftest
        run: cargo run -q -p nfc-core -- --selftest

      # 界面自检走 egui 的测试上下文，不需要真实显示服务器，
      # 但仍需 libxkbcommon 等 winit 依赖能加载。
      - name: app selftest
        run: cargo run -q -p nfc-app -- --selftest

      # 静态回归（接线守卫）：verify_parity 已脱离原版对拍，纯 Rust 侧断言。
      - name: 静态回归（接线守卫）
        run: |
          set -o pipefail
          python3 tools/verify_parity.py 2>&1 | tee /tmp/verify.log

  # ── 2) Windows：发布构建 ────────────────────────────────────────────────
  build:
    name: build (windows-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # 静态回归（接线守卫）：verify_parity 已脱离原版对拍，纯 Rust 侧断言。
      - name: 静态回归（接线守卫）
        run: python tools\verify_parity.py

      # cfg(windows) 代码（single_instance / serial 的 Windows 路径）与构建脚本
      # 只在 Windows 上参与编译，在此 lint 一次，补齐 Linux job 覆盖不到的盲区。
      - name: Clippy（Windows）
        run: cargo clippy --workspace --all-targets -- -D warnings

      # 跨平台运行期行为（路径 / 进程 / 文件权限分支）此前只在 Linux 上有
      # 测试覆盖，Windows 作为主发布平台也须跑测试。real_tools / tool_cli
      # 在 framework/bin 就位前会自动跳过，故放在 C 工具编译之前即可。
      - name: 测试（Windows）
        run: cargo test --workspace --locked

      # ── 编译 C 工具（framework/bin） ─────────────────────────────────────
      # compile.sh 支持 MINGW64，所需源码与 vendor 文件均在仓库内，
      # 在 Windows runner 上装 MSYS2 即可产出 Windows PE 格式的 C 工具，
      # 不需要用户本机跑 compile.sh。
      - name: 安装 MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          # MINGW64 已被官方标记 deprecated（建议 UCRT64），但 compile.sh 的
          # 产物路径（/mingw64/bin/*.dll 等）绑定 MINGW64 布局，暂不切换。
          suppress-deprecation-warnings: msystem-mingw64
          install: >-
            make
            mingw-w64-x86_64-crt-git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-xz
            mingw-w64-x86_64-readline
            mingw-w64-x86_64-headers-git

      - name: 编译 C 工具 (compile.sh)
        # 必须跑在 setup-msys2 提供的 msys2 shell 里：默认 bash 是 git-bash，
        # 其 PATH 没有 MSYS2 的 gcc/cmake/make/pacman，会连环 command not found。
        run: bash compile.sh
        shell: msys2 {0}

      - name: 发布构建
        run: cargo build --release --locked -p nfc-app

      # 把 C 工具与字典拷进发布目录，随 exe 一起打包。
      # app 定位工具的规则见 `runner::framework_bin`：exe 旁的 framework/bin。
      - name: 复制工具到发布目录
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/release/framework/bin | Out-Null
          Copy-Item -Recurse -Force framework/bin/* target/release/framework/bin/
          Copy-Item -Force dict.dic target/release/dict.dic
          # 统一产物名：scripts/package.sh 亦把 exe 改名为 nfctoolsgui.exe
          Copy-Item -Force target/release/nfc-app.exe target/release/nfctoolsgui.exe
          Write-Host "工具目录内容:"
          Get-ChildItem target/release/framework/bin | Select-Object Name, Length | Format-Table

      - name: 校验 PE 子系统是 GUI（不该闪黑框）
        shell: pwsh
        run: |
          $exe = "target\release\nfc-app.exe"
          if (-not (Test-Path $exe)) { throw "没产出 $exe" }
          $b = [System.IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          $sub = [BitConverter]::ToUInt16($b, $pe + 0x5C)
          # 2 = IMAGE_SUBSYSTEM_WINDOWS_GUI；3 = CONSOLE（会双击闪黑框）
          if ($sub -ne 2) { throw "Subsystem=$sub，应为 2(gui)" }
          Write-Host "ok PE Subsystem=$sub (GUI)"

      # 验证 build.rs 的 winresource 真的把 icon.ico 编进了 exe 资源
      # （RT_GROUP_ICON 类型；winresource set_icon 默认 name id = "1"）。
      - name: 校验图标资源已嵌入 exe
        shell: pwsh
        run: |
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class PeResCheck {
              [DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)]
              public static extern IntPtr LoadLibraryEx(string lpFileName, IntPtr hFile, uint dwFlags);
              [DllImport("kernel32.dll", SetLastError=true)]
              public static extern IntPtr FindResource(IntPtr hModule, IntPtr lpName, IntPtr lpType);
              [DllImport("kernel32.dll", SetLastError=true)]
              public static extern bool FreeLibrary(IntPtr hModule);
          }
          "@
          $exe = "target\release\nfc-app.exe"
          $h = [PeResCheck]::LoadLibraryEx($exe, [IntPtr]::Zero, 0x00000002) # LOAD_LIBRARY_AS_DATAFILE
          if ($h -eq [IntPtr]::Zero) { throw "LoadLibraryEx 失败: $([Runtime.InteropServices.Marshal]::GetLastWin32Error())" }
          try {
              $r = [PeResCheck]::FindResource($h, [IntPtr]1, [IntPtr]14) # RT_GROUP_ICON, MAKEINTRESOURCE(1)
              if ($r -eq [IntPtr]::Zero) { throw "exe 中未找到 RT_GROUP_ICON(id=1)，图标未嵌入" }
              Write-Host "ok: 图标资源已嵌入 (RT_GROUP_ICON id=1)"
          } finally {
              [void][PeResCheck]::FreeLibrary($h)
          }

      - name: 产出 exe 体积
        shell: pwsh
        run: |
          $mb = [math]::Round((Get-Item "target\release\nfc-app.exe").Length / 1MB, 1)
          Write-Host "nfc-app.exe = $mb MB"

      - name: 确认产物
        shell: pwsh
        run: |
          $exe = "target\release\nfc-app.exe"
          if (-not (Test-Path $exe)) { throw "未找到 $exe" }
          "{0:N1} MB" -f ((Get-Item $exe).Length / 1MB) | Write-Host
          $tools = Get-ChildItem target/release/framework/bin
          if ($tools.Count -eq 0) { throw "framework/bin 为空，compile.sh 未产出工具" }
          Write-Host "C 工具 ($($tools.Count) 个):"
          $tools | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: 上传可执行文件
        uses: actions/upload-artifact@v4
        with:
          name: nfctoolsgui-win-x64
          path: |
            target/release/nfctoolsgui.exe
            target/release/framework/bin/*
            target/release/dict.dic
          retention-days: 30

  # ── 3) Release：发布 latest 滚动版本（仿 GoRun rust-build.yml release-latest）──
  # 只随 push / workflow_dispatch 发版（PR 不发）；产物取自 build job 的 artifact，
  # 下载后以目录为基准 zip（zip 根 = nfctoolsgui.exe / framework / dict.dic，无多余
  # 一层，布局与 scripts/package.sh 一致）。每次构建强制滚动 latest 标签并重建 release。
  release-latest:
    name: publish latest release
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载发布产物
        uses: actions/download-artifact@v4
        with:
          name: nfctoolsgui-win-x64
          path: nfctoolsgui-win-x64

      - name: 打包 zip（单层，布局对标 package.sh / docs/02 §8）
        run: |
          cd nfctoolsgui-win-x64
          zip -9 -r ../NFCToolsGUI-win-x64.zip .
          unzip -l ../NFCToolsGUI-win-x64.zip

      - name: 强制更新 latest 标签
        run: |
          git tag -f latest
          git push -f origin latest

      - name: 替换 latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest -y >/dev/null 2>&1 || true
          gh release create latest NFCToolsGUI-win-x64.zip \
            --title "NFCToolsGUI CI build $(git rev-parse --short HEAD)" \
            --notes "Auto-built by cloud CI on $(date -u +%Y-%m-%d), commit $(git rev-parse --short HEAD)" \
            --latest
