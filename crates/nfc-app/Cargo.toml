[package]
name = "nfc-app"
version = "1.0.0"
edition = "2021"
rust-version = "1.95"
build = "build.rs"

[dependencies]
nfc-core = { path = "../nfc-core" }
# 渲染后端钉死 **glow**：eframe 的 default 里带 `wgpu`，会编译 wgpu/naga/spirv 整栈
# 并在运行时初始化 adapter/surface/shaders，把常驻内存抬到 160MB 级。
# 本 UI 无 wgpu 专属用法，切 glow 后内存降到几十 MB。
#
# 特性集 = eframe default 减 `wgpu` 加 `glow`。**故意不含** `winit/default`
# ——cargo 不允许在依赖 features 里写带斜杠的特性名，而 eframe 未把
# `winit/default` 重导出。差异仅在 winit 的两个 Linux 专属特性
# （`wayland-dlopen`、`wayland-csd-adwaita`）：本窗口本就
# `decorations(false)` 自绘标题栏，且 Windows 目标机上完全无感。
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "links",
    "wayland",
    "web_screen_reader",
    "x11",
    "glow",
] }
egui = "0.36"
# 解码内嵌图标 PNG（app_icon 做窗口图标、title_icon 做标题栏 logo）。
# 只开 png 特性，不拉全套图像编解码器。
image = { version = "0.25", default-features = false, features = ["png"] }
# S11-2：系统文件对话框。默认特性 = xdg-portal + wayland，**不含** gtk3，
# 故不引入任何 GTK 系统依赖；Windows / macOS 走各自的原生弹窗。
rfd = "0.17"
open = "5.4.4"

[build-dependencies]
# Windows 下把 icon.ico 嵌入 exe 资源（非 Windows 平台是 no-op）。
winres = "0.1"

[features]
# 真串口枚举：默认开（生产 GUI 必须有，否则下拉永远刷不出设备）。
# `--no-default-features` 可脱离 serialport（进而脱离 libudev）编译——
# 无头 CI / 纯语法检查的快速路径，此时枚举器退回空列表。
default = ["real-serial"]
real-serial = ["nfc-core/real-serial"]
